*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Huninn','Hiragino Maru Gothic Pro','Noto Sans TC',sans-serif;line-height:1.7}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px dashed var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 10px}
nav a{white-space:nowrap;padding:6px 12px;border-radius:99px;color:var(--ink2);text-decoration:none;font-size:14px;border:1px solid var(--line)}

main{max-width:860px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
h1{font-size:34px;margin:4px 0;letter-spacing:2px}h2{margin:18px 0 6px}h3{margin:0}
.hero{background:linear-gradient(#cfe3ee,#fbe8a6 75%,#f6d9a0);border-radius:24px;overflow:hidden;text-align:center;padding:14px 10px 0}
.hero svg{width:100%;display:block;margin-top:6px}
.sub{color:var(--ink2);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{display:inline-block;border:1px solid var(--org);color:var(--org);background:transparent;border-radius:99px;padding:3px 12px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer;margin:2px 4px 2px 0}
.btn.f{background:var(--org);color:#fff}
.tl{border-left:2px dashed var(--org);margin-left:8px;padding-left:16px}
.st{position:relative;margin-bottom:14px}.st:before{content:"";position:absolute;left:-24px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--yel);border:2px solid var(--org)}
.tm{font-weight:bold;color:var(--org)}.tag{font-size:12px;background:var(--blue);border-radius:8px;padding:1px 8px;margin-right:4px;display:inline-block}
.warn{background:var(--yel);border-radius:12px;padding:8px 12px;font-size:14px;margin:8px 0}
.drive{font-size:13px;color:var(--ink2);margin:-6px 0 10px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 8px;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px;border-bottom:1px dashed var(--line);text-align:left}
.ph{columns:2 140px;gap:8px}.ph img{width:100%;border-radius:12px;margin-bottom:8px;cursor:zoom-in;display:block}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}#lb img{max-width:95%;max-height:90%;border-radius:10px}
.done{text-decoration:line-through;opacity:.55}.x{cursor:pointer;color:var(--org);border:0;background:none;font:inherit}
:root[data-theme=sakura]{--bg:#fff0f3;--card:#fffafb;--ink:#6b3a48;--ink2:#a06b7c;--line:#f2cdd6;--blue:#f9d5de;--org:#e58aa0;--yel:#ffe3ea}

<div class="card">🚗 租車：${'Nippon Rent-a-Car 秋葉原 11/27 19:00 取、11/28 19:00 還，¥10,340（現場付款）'}｜🛡 保險 NT$2,570｜🧳 去程25kg、回程50kg｜✈ 虎航 IT216 / IT203</div>`}
function day(i){const D=DAYS[i];let h=`${M(['heads','car','fish','pilot'][i],90)}<h1 style="font-size:26px">${D.hl}｜${D.d}</h1><div class="sub">${D.t}</div>${D.warn.map(w=>`<div class="warn">${w}</div>`).join('')}<div class="tl">`;
D.stops.forEach((s,j)=>{h+=(s[6]?`<div class="drive">🚗 開車：${s[6]}</div>`:'')+`<div class="st"><span class="tm">${s[0]}</span> <b>${s[1]}</b><br>${s[2]}<br><span class="sub">📍 ${s[3]}</span>${s[4]?` <span class="tag">停留 ${s[4]}</span>`:''}<br><a class="btn f" target="_blank" href="${G(s[5])}">Google Maps</a>`;
if(j>0)h+=`<a class="btn" target="_blank" href="${R(D.stops[j-1][5],s[5])}">從上一站路線</a>`;h+=`</div>`;
});
return h+`</div><div class="card">🏨 今晚住宿：<b>${HOTEL.n}</b><br><span class="sub">${HOTEL.note}</span><br><a class="btn f" target="_blank" href="${G(HOTEL.n)}">導航</a></div><div class="sub">開車時間未標示處請按「從上一站路線」查詢即時路況（PDF未提供，故不編造）。</div>`}
function food(){return`${M('eat',110)}<h1 style="font-size:26px">餐廳專區</h1><div class="warn">以下為 PDF 提到的店家；營業時間、公休日、價格若 PDF 無資料一律標「待確認」，出發前請在 Google Maps 查證。</div>`+FOOD.map(f=>`<div class="card"><b>${f[1]}</b> <span class="tag">${f[0]}</span><br>🍽 ${f[2]}<br>🕘 ${f[3]}｜💴 ${f[4]}<br>🚶 ${f[5]}<br><a class="btn f" target="_blank" href="${G(f[6])}">Google Maps</a></div>`).join('')}
function budget(){const B=L('bud',{rate:0.21,goal:0,names:['A','B','C','D'],items:[]});const sv=()=>S('bud',B);
const twd=x=>x.cur=='JPY'?x.amt*B.rate:+x.amt,tot=B.items.reduce((s,x)=>s+twd(x),0);
const by={};B.items.forEach(x=>by[x.who]=(by[x.who]||0)+twd(x));
const el=document.createElement('div');el.innerHTML=`${M('bag',110)}<h1 style="font-size:26px">預算管理</h1><div class="card">日幣匯率 1 JPY = <input id="rt" type="number" step="0.001" value="${B.rate}" style="width:80px"> TWD　預算(TWD) <input id="gl" type="number" value="${B.goal}" style="width:100px"><br>旅伴：${B.names.map((n,i)=>`<input class="nm" data-i="${i}" value="${n}" style="width:60px">`).join(' ')}</div>
<div class="card"><select id="ct">${CATS.map(c=>`<option>${c}</option>`).join('')}</select> <input id="nt" placeholder="備註" style="width:110px"> <input id="am" type="number" placeholder="金額" style="width:90px"> <select id="cu"><option>JPY</option><option>TWD</option></select> <select id="wh">${B.names.map(n=>`<option>${n}</option>`).join('')}</select> <button class="btn f" id="add">新增</button></div>
<div class="card"><b>總花費 NT$ ${Math.round(tot).toLocaleString()}</b>｜預算 NT$ ${(+B.goal).toLocaleString()}｜${B.goal?(B.goal-tot>=0?'剩餘 ':'超支 ')+'NT$ '+Math.abs(Math.round(B.goal-tot)).toLocaleString():'尚未設定預算'}<br><span class="sub">${B.names.map(n=>n+' 已付 NT$'+Math.round(by[n]||0).toLocaleString()).join('｜')}｜每人平均 NT$${Math.round(tot/B.names.length).toLocaleString()}</span></div>
<div class="card" style="overflow-x:auto"><table><tr><th>類別</th><th>備註</th><th>金額</th><th>≈TWD</th><th>付款</th><th></th></tr>${B.items.map((x,i)=>`<tr><td>${x.cat}</td><td>${x.note||''}</td><td>${x.amt} ${x.cur}</td><td>${Math.round(twd(x))}</td><td>${x.who}</td><td><button class="x" data-e="${i}">改</button><button class="x" data-d="${i}">✕</button></td></tr>`).join('')||'<tr><td colspan=6>尚無支出</td></tr>'}</table></div>`;
setTimeout(()=>{$('#add').onclick=()=>{const a=+$('#am').value;if(!a)return alert('請輸入金額');B.items.push({cat:$('#ct').value,note:$('#nt').value,amt:a,cur:$('#cu').value,who:$('#wh').value});sv();render()};
$('#rt').onchange=e=>{B.rate=+e.target.value;sv();render()};$('#gl').onchange=e=>{B.goal=+e.target.value;sv();render()};
document.querySelectorAll('.nm').forEach(n=>n.onchange=e=>{B.names[e.target.dataset.i]=e.target.value;sv();render()});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{B.items.splice(b.dataset.d,1);sv();render()});
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const x=B.items[b.dataset.e],v=prompt('修改金額',x.amt);if(v&&+v){x.amt=+v;x.note=prompt('修改備註',x.note||'')??x.note;sv();render()}})});return el}
function photos(){const P=L('ph',{1:[],2:[],3:[],4:[]}),cur=+(sessionStorage.pd||1),el=document.createElement('div');
el.innerHTML=`${M('hak',120)}<h1 style="font-size:26px">旅行相簿</h1><div>${[1,2,3,4].map(n=>`<button class="btn ${n==cur?'f':''}" data-n="${n}">DAY ${n}</button>`).join('')}</div><div class="card"><input type="file" id="fi" accept="image/*" multiple><div class="sub">照片會壓縮後存在這支手機/瀏覽器內，不會上傳到網路；換裝置不會同步。</div></div><div class="ph">${(P[cur]||[]).map((s,i)=>`<div><img src="${s}" data-i="${i}"><button class="x" data-r="${i}">刪除</button></div>`).join('')||'<p class="sub">這天還沒有照片</p>'}</div>`;
setTimeout(()=>{document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{sessionStorage.pd=b.dataset.n;render()});
document.querySelectorAll('.ph img').forEach(im=>im.onclick=()=>{$('#lbi').src=im.src;$('#lb').style.display='flex'});
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{P[cur].splice(b.dataset.r,1);S('ph',P);render()});
$('#fi').onchange=async e=>{for(const f of e.target.files){await new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);(P[cur]=P[cur]||[]).push(c.toDataURL('image/jpeg',.7));ok()};im.onerror=ok;im.src=r.result};r.readAsDataURL(f)})}S('ph',P);render()}});return el}
function list(){const C=L('chk',null)||Object.fromEntries(Object.entries(LIST0).map(([k,v])=>[k,v.map(t=>({t,d:0}))]));const el=document.createElement('div');el.innerHTML=M('mirror',80)+'<h1 style="font-size:26px">旅行清單</h1>'+Object.keys(C).map(k=>`<div class="card"><b>${k}</b>${C[k].map((x,i)=>`<div><label class="${x.d?'done':''}"><input type="checkbox" data-k="${k}" data-i="${i}" ${x.d?'checked':''}> ${x.t}</label> <button class="x" data-dk="${k}" data-di="${i}">✕</button></div>`).join('')}<input placeholder="新增項目…" data-add="${k}" style="width:70%"> <button class="btn" data-ab="${k}">新增</button></div>`).join('');
setTimeout(()=>{document.querySelectorAll('[data-i]').forEach(c=>c.onchange=()=>{C[c.dataset.k][c.dataset.i].d=c.checked?1:0;S('chk',C);render()});
document.querySelectorAll('[data-dk]').forEach(b=>b.onclick=()=>{C[b.dataset.dk].splice(b.dataset.di,1);S('chk',C);render()});
document.querySelectorAll('[data-ab]').forEach(b=>b.onclick=()=>{const v=document.querySelector(`[data-add="${b.dataset.ab}"]`).value.trim();if(v){C[b.dataset.ab].push({t:v,d:0});S('chk',C);render()}})});return el}
function weather(){return`<h1 style="font-size:26px">天氣資訊</h1><div class="warn">本頁不內建即時API（避免顯示不可靠或虛構的數據）。請用下列官方/可靠連結查看天氣、降雪機率、風速與警報。</div>`+WX.map(w=>`<div class="card"><b>${w[0]}</b><br><a class="btn f" target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(w[1]+' 天氣')}">Google 天氣</a><a class="btn" target="_blank" href="https://www.windy.com/?${encodeURIComponent(w[1])}">Windy 風速</a></div>`).join('')+`<div class="card"><a class="btn f" target="_blank" href="https://www.jma.go.jp/bosai/warning/">氣象廳 警報</a><a class="btn" target="_blank" href="https://tenki.jp/">tenki.jp</a><a class="btn" target="_blank" href="https://www.jartic.or.jp/">JARTIC 道路情報</a></div>`}
function render(){const p=(location.hash||'#home').slice(1),i=PAGES.indexOf(p),pg=i<0?'home':p;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p==pg));
const o=pg=='home'?home():pg.startsWith('day')?day(+pg[3]-1):pg=='map'?mapPg():pg=='food'?food():pg=='budget'?budget():pg=='photos'?photos():pg=='list'?list():weather();const a=$('#app');a.innerHTML='';typeof o=='string'?a.innerHTML=o:a.appendChild(o)}
const th=document.createElement('a');th.textContent='🎀 主題';th.style.cursor='pointer';th.onclick=()=>{const v=document.documentElement.dataset.theme=='sakura'?'cream':'sakura';document.documentElement.dataset.theme=v;S('th',v)};$('#nav').appendChild(th);if(L('th')=='sakura')document.documentElement.dataset.theme='sakura';
setInterval(()=>{const a=$('#jt');if(a){const f=z=>new Date().toLocaleTimeString('zh-TW',{timeZone:z,hour12:false});a.textContent=f('Asia/Tokyo');$('#tt').textContent=f('Asia/Taipei')}},1000);
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script></body></html>
